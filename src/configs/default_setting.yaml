DEFAULT:
  exp_name: system_control
  seed: 42
  del_pt: False

DATASET:
  datadir: ../../data/kweather/
  scaler: standard
  split_rate: [0.8, 0.1, 0.1]
  split_date: null
  start_date: 2025-08-04 00:00
  end_date: null
  # end_date: 2023-12-31 23:00:00  
  batch_size: 64
  num_workers: 0
  shuffle: false
  pin_memory: true
  drop_last: false
  environment_name: livingroom
  data_version: version2_250813_processed
  seq_len: 120
  stride_len: 1
  pred_len: 60
  c_out: 1
  ord_categorical_feature: ['환기풍량']
  categorical_features: ['환기전원', '환기운전모드', '냉난방전원', '냉난방풍량', '냉난방운전모드']
  cat_encode_method: label
  numerical_features: [
    '실내미세먼지(㎍/㎥)', '실내초미세먼지(㎍/㎥)', '실내이산화탄소(ppm)', 
    '실내휘발성유기화합물(ppb)', '실내온도(℃)', '실내습도(%)', 
    '실외미세먼지(㎍/㎥)', '실외초미세먼지(㎍/㎥)', '실외온도(℃)', 
    '실외습도(%)', '환기누적전력량(Wh)', '환기유효전력(W)', 
    '냉난방설정온도(℃)', '냉난방누적전력량(Wh)', '냉난방유효전력(W)'
    ]
  target_features: ['환기유효전력(W)', '냉난방유효전력(W)']
  input_features: null
  ignore_feature: null

MPC:
  use_mpc: false
  prediction_horizon: 24  
  control_horizon: 12     
  dt: 0.25               
  mpc_iter: 50


TRAIN:
  epoch: 20
  ckp_metric: loss
  eval_epochs: 1
  log_epochs: 1
  log_eval_iter: 100
  early_stopping_count: 5
  early_stopping_metric: mse
  lradj: type1
  resume: null
  return_output: true
  plot_result: false
  del_pt_file: true
  data_num: 0
  fine_tuning_method: full
  grad_accum_steps: 1
  mixed_precision: 'no'
  clamping: True
  wandb: 
    use: false
    wandb_iter: 500
    exp_name: default
    project_name: 'system_control'
    entity: null
LOSS:
  loss_name: mse

OPTIMIZER:
  opt_name: adamw
  lr: 0.0001
  params:
    weight_decay: 0.0005

RESULT:
  savedir: './saved_model'
