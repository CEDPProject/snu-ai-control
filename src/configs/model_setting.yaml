TabTransformer:
  tab_model_args:
    cat_field_dims: cat_field_dims
    cons_dims: 91
    embed_dim: 512
    depth: 2
    n_heads: 4
    att_dropout: 0.1
    ffn_mult: 2
    ffn_dropout: 0.1
    ffn_act: GEGLU
    an_dropout: 0.1
    mlp_dims: [10, 10]
    mlp_dropout: 0.1
  tsa_model_args:
    embed_type: 3
    factor: 3
    output_attention: False
    d_model: 512
    embed: timeF
    freq: h
    dropout: 0.05
    n_heads: 8
    d_ff: 2048
    moving_avg: 25
    activation: gelu
    e_layers: 2
    d_layers: 1
    distil: True
    enc_in: tsa_n_series
    dec_in: tsa_n_series
    c_out: tsa_n_series
    n_series: tsa_n_series
  tsb_model_args:
    embed_type: 3
    factor: 3
    output_attention: False
    d_model: 512
    embed: timeF
    freq: h
    dropout: 0.05
    n_heads: 8
    d_ff: 2048
    moving_avg: 25
    activation: gelu
    e_layers: 2
    d_layers: 1
    distil: True
    enc_in: tsb_n_series
    dec_in: tsb_n_series
    c_out: tsb_n_series
    n_series: tsb_n_series

FTTransformer:
  tab_model_args: 
    d_numerical: d_numerical
    categories: cat_field_dims
    token_bias: True
    activation: gelu
    attention_dropout: 0.2
    d_ffn_factor: 1.333333333333333
    d_token: 512
    ffn_dropout: 0.1
    initialization: kaiming
    kv_compression: 0.064
    kv_compression_sharing: headwise
    n_heads: 8
    n_layers: 3
    prenormalization: True
    residual_dropout: 0.0
    d_out: 512
    mlp_dims: [10, 10]
    mlp_dropout: 0.5
  tsa_model_args: 
    embed_type: 3
    factor: 3
    output_attention: False
    d_model: 512
    embed: timeF
    freq: h
    dropout: 0.05
    n_heads: 8
    d_ff: 2048
    moving_avg: 25
    activation: gelu
    e_layers: 2
    d_layers: 1
    distil: True
    enc_in: tsa_n_series
    dec_in: tsa_n_series
    c_out: tsa_n_series
    n_series: tsa_n_series
  tsb_model_args: 
    embed_type: 3
    factor: 3
    output_attention: False
    d_model: 512
    embed: timeF
    freq: h
    dropout: 0.05
    n_heads: 8
    d_ff: 2048
    moving_avg: 25
    activation: gelu
    e_layers: 2
    d_layers: 1
    distil: True
    enc_in: tsb_n_series
    dec_in: tsb_n_series
    c_out: tsb_n_series
    n_series: tsb_n_series

