TemporalFusionTransformer:
  static_categorical_inp_lens: [4, 2]
  temporal_tsb_categorical_inp_lens: []
  temporal_tsa_categorical_inp_lens: []
  encoder_length: null
  n_head: 4
  hidden_size: 128
  dropout: 0.1
  attn_dropout: 0.0
  temporal_tsb_continuous_inp_size: 104
  tsb_times: 6
  temporal_tsa_continuous_inp_size: 58
  tsa_times: 2
  temporal_target_size: 276
  static_continuous_inp_size: 80
  num_static_vars : static_continuous_inp_size + len(static_categorical_inp_lens)
  num_future_vars : temporal_tsb_continuous_inp_size + len(temporal_tsb_categorical_inp_lens)
  num_historic_vars : temporal_tsa_continuous_inp_size+ len(temporal_tsa_categorical_inp_lens)
  n_times: tsb_times+tsa_times
  gmlp_enabled: false
  mlp_dims: [256, 256]
  depth: 2
  gmlp_depth: 3
  attention_together: True
  RNN_type: GRU